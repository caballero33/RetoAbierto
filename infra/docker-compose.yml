version: '3.8'

services:
  db-retoabierto:
    image: postgres:16-alpine
    container_name: postgres-retoabierto
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_retoabierto_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d RetoAbiertoDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_retoabierto_data:
