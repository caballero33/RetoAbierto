name: retoabierto

services:
  db-retoabierto:
    image: postgres:16-alpine
    container_name: postgres-retoabierto
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_retoabierto_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-retoabierto:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: retoabierto-api
    container_name: api-retoabierto
    restart: unless-stopped
    depends_on:
      db-retoabierto:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgresConnection: "Host=db-retoabierto;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpiryHours: 8
    ports:
      - "5000:8080"

volumes:
  postgres_retoabierto_data:
